---
name: build
# description: Builds, tests and publishes artifacts to sonatype snapshots
on:
  push:
    branches:
      - 'main'
      - '**-SNAPSHOT'
    paths-ignore:
      - '**/README.adoc'
      - 'docs/**'
      - '.github/workflows/publish-documentation.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests
        type: boolean
        required: false
        default: false
      log_level:
        description: Log level
        type: choice
        options:
          - TRACE
          - DEBUG
          - INFO
          - WARN
          - ERROR
        required: false
        default: 'WARN' # the logging is quite verbose, and the default level makes the GitHub Action output unwieldy



concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.skip_tests == 'true' && 'no-tests' || 'with-tests' }}
  cancel-in-progress: true


jobs:
  build:
    name: build (${{ matrix.os }}, java-${{ matrix.java }}${{ github.event.inputs.skip_tests == 'true' && ', no tests' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
        java: [ 17 ]
        # also check (once) on latest
        include:
          - os: ubuntu-latest
            java: 25
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 17
            rank: main
    runs-on: ${{ matrix.os }}
    env:
      MAVEN_ARGS: '--no-transfer-progress --color=always'
      #FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Use personal token for the commit at the end. otherwise publish-documentation action is not triggered
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      - name: Validate Central publishing credentials
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$CENTRAL_USERNAME" || { echo "::error::CENTRAL_USERNAME is empty"; exit 1; }
          test -n "$CENTRAL_PASSWORD" || { echo "::error::CENTRAL_PASSWORD is empty"; exit 1; }
          echo "Central credentials are present."

          settings_file="$HOME/.m2/settings.xml"
          test -f "$settings_file" || { echo "::error::Maven settings.xml was not generated"; exit 1; }
          grep -q '<id>central</id>' "$settings_file" \
            || { echo "::error::Maven settings.xml has no server with id central"; exit 1; }
          echo "Maven settings.xml contains the central server entry."

          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --user "$CENTRAL_USERNAME:$CENTRAL_PASSWORD" \
            https://central.sonatype.com/api/v1/publisher/deployments)"
          case "$status" in
            401)
              echo "::error::Central rejected CENTRAL_USERNAME/CENTRAL_PASSWORD with HTTP 401"
              exit 1
              ;;
            403)
              echo "::error::Central recognized the credentials but denied Publisher API access with HTTP 403"
              exit 1
              ;;
            200)
              echo "Central Publisher API authentication succeeded."
              ;;
            *)
              echo "::error::Central Publisher API returned unexpected HTTP $status"
              exit 1
              ;;
          esac
      - name: Suppress Java 25 Lombok Unsafe warning
        if: ${{ matrix.java == 25 }}
        run: echo "MAVEN_OPTS=--sun-misc-unsafe-memory-access=allow" >> "$GITHUB_ENV"
      - name: Build with maven
        shell: bash
        id: maven
        # allow the build step to fail (e.g. test failures) without failing the entire job
        continue-on-error: true
        timeout-minutes: 15
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
        run: |
          if [[ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true' }}" == "true" ]]; then
            extra_arg="-DskipTests"
          else
            extra_arg="-Dmaven.test.failure.ignore=true"
          fi
          log_level="${{ github.event.inputs.log_level || 'WARN' }}"
          maven_args=(-B "$extra_arg" "-Dlog4j2.root.level=$log_level")
          if [[ "${{ matrix.rank }}" == "main" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == *-SNAPSHOT ) ]]; then
            maven_args+=(-Pdeploy deploy)
          else
            maven_args+=(test)
          fi
          set +e
          mvn "${maven_args[@]}" 2>&1 | awk '
            /If you are an AI Agent/ { skip_blank_line = 1; next }
            skip_blank_line && /^[[:space:]]*$/ { skip_blank_line = 0; next }
            { skip_blank_line = 0; print; fflush() }
          '
          mvn_exit=${PIPESTATUS[0]}
          set -e
          exit "$mvn_exit"
      - uses: codecov/codecov-action@v7
        if: ${{ matrix.rank == 'main' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required
          # Only the aggregated report; it is the only one that also credits
          # coverage of a module's classes by tests in _other_ modules.
          files: report-aggregation/target/site/jacoco-aggregate/jacoco.xml
          disable_search: true
      - name: Commit generated graphviz file if it changed
        if: ${{ matrix.rank == 'main' }}
        uses: EndBug/add-and-commit@v11
        with:
          message: Automated update of dot.m4
          add: docs/algebras.dot.m4
          pull: '--rebase --autostash'
      - uses: MMProgrami/after-maven-action@v2.9
        id: after_maven
        with:
          coverage: true
          determine_version: true
          maven_outcome: ${{ steps.maven.outcome }}
